<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="bevelEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1" />
    </linearGradient>
    
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.6" result="offsetcolor"/>
      <feComposite in="offsetcolor" in2="offsetblur" operator="in" result="offsetblur"/>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="lightningGlow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sparkleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="glossShine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="earthGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#6DB3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
    </radialGradient>

    <!-- Animação de pulsação para as faíscas -->
    <style>
      @keyframes sparkle1 {
        0% { opacity: 0; }
        25% { opacity: 0.8; }
        50% { opacity: 1; }
        75% { opacity: 0.6; }
        100% { opacity: 0; }
      }
      @keyframes sparkle2 {
        0% { opacity: 0.4; }
        25% { opacity: 0.2; }
        50% { opacity: 0.9; }
        75% { opacity: 0.3; }
        100% { opacity: 0.1; }
      }
      @keyframes sparkle3 {
        0% { opacity: 0.1; }
        25% { opacity: 0.7; }
        50% { opacity: 0.3; }
        75% { opacity: 1; }
        100% { opacity: 0.2; }
      }
      .spark1 { animation: sparkle1 2.5s infinite; }
      .spark2 { animation: sparkle2 2.8s infinite; }
      .spark3 { animation: sparkle3 3.2s infinite; }
    </style>
  </defs>
  
  <!-- Fundo Escuro Profissional -->
  <rect width="200" height="200" rx="12" fill="url(#darkGradient)" filter="url(#dropShadow)"/>
  
  <!-- Borda sutil profissional -->
  <rect width="200" height="200" rx="12" fill="none" stroke="url(#bevelEdge)" stroke-width="2"/>
  <rect x="2" y="2" width="196" height="196" rx="10" fill="none" stroke="#4A6FA5" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Brilho glossy discreto no topo -->
  <ellipse cx="100" cy="50" rx="70" ry="40" fill="url(#glossShine)"/>
  
  <!-- ===== RAIO AMARELO ESTILO HARRY POTTER ===== -->
  <g filter="url(#lightningGlow)">
    <!-- Sombra do raio -->
    <g transform="translate(1, 1)" opacity="0.2">
      <path d="M 100,18 L 82,48 L 93,54 L 70,92 L 85,98 L 60,145 L 78,152 L 100,195 L 122,152 L 140,145 L 115,98 L 130,92 L 107,54 L 118,48 Z" 
            fill="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Raio amarelo brilhante principal -->
    <path d="M 100,18 L 82,48 L 93,54 L 70,92 L 85,98 L 60,145 L 78,152 L 100,195 L 122,152 L 140,145 L 115,98 L 130,92 L 107,54 L 118,48 Z" 
          fill="#FFD700" stroke="#FFF700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#lightningGlow)"/>
    
    <!-- Núcleo interno amarelo mais brilhante -->
    <path d="M 100,25 L 88,50 L 96,56 L 78,92 L 90,100 L 72,145 L 86,152 L 100,185 L 114,152 L 128,145 L 110,100 L 122,92 L 104,56 L 112,50 Z" 
          fill="#FFFF00" opacity="0.85" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Brilho branco intenso nas extremidades -->
    <path d="M 100,18 L 82,48 L 93,54 L 70,92 L 85,98 L 60,145 L 78,152 L 100,195 L 122,152 L 140,145 L 115,98 L 130,92 L 107,54 L 118,48 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ponta aguda do raio com máximo brilho -->
    <polygon points="100,18 97,28 103,28" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="100,195 96,185 104,185" fill="#FFFFFF" opacity="0.8"/>
  </g>
  
  <!-- ===== LETRA "N" MARROM ESCURO ===== -->
  <g filter="url(#dropShadow)">
    <!-- Sombra 3D da letra -->
    <path d="M 45,55 L 45,145 L 65,145 L 65,82 L 102,140 L 122,140 L 68,78 L 155,55 L 135,55 L 65,98 L 65,55 Z" 
          fill="#0a0a0a" opacity="0.4" transform="translate(1.5, 1.5)"/>
    
    <!-- Letra N em marrom escuro -->
    <defs>
      <linearGradient id="brownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#6B4423;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M 45,55 L 45,145 L 65,145 L 65,82 L 102,140 L 122,140 L 68,78 L 155,55 L 135,55 L 65,98 L 65,55 Z" 
          fill="url(#brownGradient)" stroke="#4A2511" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Brilho sutil na letra marrom -->
    <path d="M 52,68 L 52,115 L 85,95 L 85,68 Z" fill="#FFFFFF" opacity="0.25"/>
  </g>
  
  <!-- ===== PLANETA TERRA (AZUL E VERDE) ===== -->
  <g filter="url(#dropShadow)">
    <!-- Círculo base azul oceano -->
    <circle cx="158" cy="100" r="32" fill="#003DA5" stroke="#001E6D" stroke-width="1.5"/>
    
    <!-- Gradiente oceano azul claro -->
    <circle cx="158" cy="100" r="30" fill="url(#earthGradient)"/>
    
    <!-- Continentes - VERDE INTENSO Brasil -->
    <g fill="#228B22" opacity="0.95">
      <!-- América do Sul (Brasil em destaque) -->
      <ellipse cx="145" cy="118" rx="9" ry="13"/>
      <!-- América do Norte -->
      <ellipse cx="165" cy="82" rx="7" ry="9"/>
      <!-- Outro continente -->
      <ellipse cx="175" cy="105" rx="5" ry="7"/>
    </g>
    
    <!-- Detalhe de verde mais escuro para contraste -->
    <g fill="#1B6B2F" opacity="0.6">
      <ellipse cx="147" cy="122" rx="5" ry="8"/>
    </g>
    
    <!-- Brilho especular principal da Terra -->
    <circle cx="144" cy="85" r="12" fill="#FFFFFF" opacity="0.45"/>
    
    <!-- Destaque branco muito brilhante (ponto de luz principal) -->
    <circle cx="147" cy="88" r="6" fill="#FFFFFF" opacity="0.75"/>
    
    <!-- Reflexo azul claro sutil -->
    <ellipse cx="150" cy="85" rx="4" ry="5" fill="#87CEEB" opacity="0.4"/>
  </g>
  
  <!-- ===== EFEITO TECH/ENERGIA - FAÍSCAS SUTIS DE MAGIA ===== -->
  
  <!-- Anel de energia pulsante ao redor do raio -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.25" filter="url(#lightningGlow)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FFFF00" stroke-width="0.5" opacity="0.15" filter="url(#lightningGlow)"/>
  
  <!-- Faíscas de magia - Padrão 1 (Canto superior direito) -->
  <g class="spark1" filter="url(#sparkleGlow)">
    <circle cx="160" cy="35" r="1.5" fill="#FFD700"/>
    <circle cx="165" cy="40" r="1" fill="#FFFF00" opacity="0.8"/>
    <path d="M 160,35 L 168,28" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas de magia - Padrão 2 (Canto inferior esquerdo) -->
  <g class="spark2" filter="url(#sparkleGlow)">
    <circle cx="35" cy="165" r="1.5" fill="#FFD700"/>
    <circle cx="40" cy="160" r="1" fill="#FFFF00" opacity="0.8"/>
    <path d="M 35,165 L 28,172" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas de magia - Padrão 3 (Lado esquerdo) -->
  <g class="spark1" filter="url(#sparkleGlow)">
    <circle cx="25" cy="100" r="1.2" fill="#FFD700"/>
    <circle cx="20" cy="105" r="0.8" fill="#FFFF00" opacity="0.7"/>
    <path d="M 25,100 L 15,95" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas de magia - Padrão 4 (Lado direito) -->
  <g class="spark3" filter="url(#sparkleGlow)">
    <circle cx="175" cy="95" r="1.3" fill="#FFD700"/>
    <circle cx="180" cy="90" r="0.9" fill="#FFFF00" opacity="0.75"/>
    <path d="M 175,95 L 185,88" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas de magia - Padrão 5 (Superior esquerdo) -->
  <g class="spark2" filter="url(#sparkleGlow)">
    <circle cx="40" cy="40" r="1.1" fill="#FFD700"/>
    <circle cx="35" cy="45" r="0.8" fill="#FFFF00" opacity="0.7"/>
    <path d="M 40,40 L 48,32" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas de magia - Padrão 6 (Inferior direito) -->
  <g class="spark3" filter="url(#sparkleGlow)">
    <circle cx="170" cy="170" r="1.2" fill="#FFD700"/>
    <circle cx="175" cy="165" r="0.85" fill="#FFFF00" opacity="0.75"/>
    <path d="M 170,170 L 162,177" stroke="#FFD700" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Faíscas adicionais flutuantes (efeito disperso) -->
  <g class="spark1" filter="url(#sparkleGlow)">
    <circle cx="65" cy="25" r="0.9" fill="#FFFF00" opacity="0.6"/>
  </g>
  <g class="spark2" filter="url(#sparkleGlow)">
    <circle cx="135" cy="175" r="0.8" fill="#FFD700" opacity="0.5"/>
  </g>
  <g class="spark3" filter="url(#sparkleGlow)">
    <circle cx="20" cy="60" r="1" fill="#FFFF00" opacity="0.55"/>
  </g>
  <g class="spark1" filter="url(#sparkleGlow)">
    <circle cx="180" cy="140" r="0.95" fill="#FFD700" opacity="0.6"/>
  </g>
  
  <!-- Conexões de energia entre pontos -->
  <g stroke="#FFD700" stroke-width="0.4" opacity="0.15" filter="url(#sparkleGlow)">
    <line x1="160" y1="35" x2="100" y2="60"/>
    <line x1="35" y1="165" x2="100" y2="140"/>
    <line x1="25" y1="100" x2="70" y2="100"/>
    <line x1="175" y1="95" x2="130" y2="100"/>
  </g>
</svg>