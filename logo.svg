<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo escuro -->
  <defs>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0047ab;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="200" fill="#0a0a0a"/>
  
  <!-- Raio de energia (N em forma de raio) -->
  <g filter="url(#glow)" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Primeiro traço diagonal (cima-esquerda para baixo-direita) -->
    <path d="M 50 40 L 120 150"/>
    <!-- Segundo traço vertical -->
    <path d="M 120 40 L 120 150"/>
    <!-- Terceiro traço diagonal (baixo-direita para cima-esquerda) -->
    <path d="M 50 150 L 120 50"/>
  </g>
  
  <!-- Efeito de raio/energia ao redor do N -->
  <g opacity="0.6" stroke="#FFFF00" stroke-width="1" fill="none">
    <circle cx="85" cy="95" r="45" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Planeta Terra (esfera) -->
  <g transform="translate(140, 60)">
    <!-- Esfera com gradiente azul (oceano) -->
    <circle cx="0" cy="0" r="25" fill="url(#earthGradient)" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Continentes (simplificados) -->
    <g fill="#2d8659" opacity="0.8">
      <!-- América do Sul (verde) -->
      <ellipse cx="-8" cy="8" rx="6" ry="10"/>
      <!-- África (verde) -->
      <ellipse cx="10" cy="5" rx="7" ry="9"/>
      <!-- Europa (verde) -->
      <ellipse cx="8" cy="-8" rx="4" ry="5"/>
    </g>
    
    <!-- Brilho na esfera -->
    <circle cx="-8" cy="-8" r="8" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Texto: NEXUS BRASIL -->
  <text x="100" y="185" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">NEXUS BRASIL</text>
</svg>